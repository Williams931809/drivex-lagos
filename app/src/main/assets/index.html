<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial;color:white}canvas{display:block}#hud{position:absolute;top:12px;left:14px;background:#101b2dcc;padding:12px;border-radius:12px;font-weight:bold}#ctrl{position:absolute;bottom:15px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}.grp{display:flex;gap:12px}button{pointer-events:auto;border:2px solid #ffffff77;border-radius:16px;background:#12213bbb;color:white;font-size:22px;font-weight:bold;min-width:74px;min-height:66px;touch-action:none}#menu{position:absolute;right:14px;top:12px;display:flex;gap:8px}#menu button{min-width:55px;min-height:42px;font-size:13px}#msg{position:absolute;top:25%;width:100%;text-align:center;font-size:24px;font-weight:bold;text-shadow:0 2px 5px #000}</style></head><body><div id="hud">DRIVEX • LAGOS<br><span id="speed">0</span> KM/H · ₦<span id="money">0</span><br><span id="mission">Drive 1000m</span> · <span id="dist">0</span>m</div><div id="menu"><button id="camera">CAM</button><button id="reset">RESET</button></div><div id="msg"></div><div id="ctrl"><div class="grp"><button data-key="left">◀</button><button data-key="right">▶</button></div><div class="grp"><button data-key="brake">BRAKE</button><button data-key="gas">GAS</button></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x91c9ed);scene.fog=new THREE.Fog(0x91c9ed,90,280);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,500),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2));const sun=new THREE.DirectionalLight(0xffffff,1.5);sun.position.set(-30,80,40);scene.add(sun);
function box(w,h,d,c,x,y,z){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);scene.add(m);return m}
box(240,.1,6000,0x579259,0,-.1,-2400);box(23,.1,6000,0x333841,0,0,-2400);
for(let z=-5000;z<150;z+=16){box(.25,.04,6,0xfff1a0,0,.08,z);for(let side of [-1,1]){box(.4,.25,16,0xeeeeee,side*11.5,.12,z);if(z%48===0){let h=12+Math.random()*35;box(12,h,15,Math.random()*0xffffff,side*(22+Math.random()*18),h/2,z)}}}
const car=new THREE.Group();scene.add(car);function part(w,h,d,c,x,y,z){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);car.add(m)}part(2.3,.75,4.5,0xe43c2e,0,.8,0);part(1.8,.75,2.4,0x172c42,0,1.5,-.25);for(let x of [-1.15,1.15])for(let z of [-1.4,1.4])part(.4,.75,.75,0x151515,x,.48,z);
const traffic=[];for(let i=0;i<24;i++){let x=[-7,-3.5,3.5,7][i%4],z=-80-i*130;let m=box(2.1,1.5,4,0x3366aa,x,.85,z);traffic.push(m)}
let keys={},speed=0,travel=0,cash=+(localStorage.cash||0),view=0,last=performance.now(),health=100;
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',()=>keys[k]=false);b.addEventListener('pointercancel',()=>keys[k]=false)});
onkeydown=e=>{keys[{ArrowUp:'gas',ArrowDown:'brake',ArrowLeft:'left',ArrowRight:'right'}[e.key]||e.key]=true};onkeyup=e=>{keys[{ArrowUp:'gas',ArrowDown:'brake',ArrowLeft:'left',ArrowRight:'right'}[e.key]||e.key]=false};
document.getElementById('camera').onclick=()=>view=(view+1)%3;document.getElementById('reset').onclick=()=>{car.position.set(0,0,0);speed=0;health=100};
function tick(now){requestAnimationFrame(tick);let dt=Math.min((now-last)/1000,.05);last=now;speed=Math.max(-10,Math.min(145,speed+(keys.gas?55:keys.brake?-90:-20*Math.sign(speed))*dt));if(Math.abs(speed)<.2&&!keys.gas)speed=0;
car.position.z-=speed/3.6*dt;car.position.x+=((keys.right?1:0)-(keys.left?1:0))*dt*Math.min(12,3+Math.abs(speed)/12);car.position.x=Math.max(-10,Math.min(10,car.position.x));travel+=Math.max(0,speed/3.6*dt);
for(let t of traffic){t.position.z+=dt*12;if(t.position.z>car.position.z+60)t.position.z=car.position.z-900-Math.random()*500;if(Math.abs(t.position.z-car.position.z)<3.4&&Math.abs(t.position.x-car.position.x)<2.1){speed=0;health-=dt*25;document.getElementById('msg').textContent='COLLISION!';setTimeout(()=>document.getElementById('msg').textContent='',800)}}
if(travel>=1000){cash+=500;localStorage.cash=cash;travel=0;document.getElementById('msg').textContent='MISSION COMPLETE +₦500';setTimeout(()=>document.getElementById('msg').textContent='',2200)}
let target=view===0?new THREE.Vector3(car.position.x,6,car.position.z+12):view===1?new THREE.Vector3(car.position.x,2,car.position.z+1):new THREE.Vector3(car.position.x,23,car.position.z+15);camera.position.lerp(target,.14);camera.lookAt(car.position.x,1,car.position.z-16);
document.getElementById('speed').textContent=Math.round(Math.abs(speed));document.getElementById('money').textContent=cash;document.getElementById('dist').textContent=Math.round(travel);renderer.render(scene,camera)}
requestAnimationFrame(tick);onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
</script></body></html>
